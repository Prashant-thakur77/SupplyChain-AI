[project]
name = "supplychain-agent-service"
version = "0.1.0"
description = "SupplyChain AI — Strands Agents service (sentinel, analyst, router, impact, strategist, forecaster, scenario, copilot)"
requires-python = ">=3.10"
dependencies = [
  "strands-agents[a2a,gemini,ollama,openai]>=1.0",
  "strands-agents-tools>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "supabase>=2.5",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34", "bedrock-agentcore>=0.1"]
memory = ["mem0ai>=0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
